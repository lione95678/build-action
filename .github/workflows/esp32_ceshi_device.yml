name: Build ESPHome Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build ESPHome Firmware
        uses: esphome/build-action@v3 # 或者你 fork 后的具体版本标签
        with:
          yaml_file: esp32_ceshi_device.yaml # 替换为你实际的 yaml 文件名